name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint with Biome
        run: npx @biomejs/biome check .

      - name: Type check
        run: npm run type-check

      - name: Run unit tests
        run: npm run test:unit

      - name: Build package
        run: npm run build

  integration-test:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: |
          # Clear any incremental build cache
          rm -rf tsconfig.tsbuildinfo
          npm run build

      - name: Verify package build
        run: |
          echo "Verifying package build:"
          ls -la dist/
          echo "Checking main entry point:"
          head -5 dist/index.js
          echo "Checking utils files:"
          ls -la dist/utils/

      - name: Run integration tests
        run: npm run test:integration

      - name: Setup demo app
        run: |
          cd demo-app
          npm ci
          # Ensure the symlinked package is properly resolved
          ls -la node_modules/next-markdown-blog/dist/
          # Reinstall the package to ensure it uses the latest build
          npm install

      - name: Build demo app
        run: |
          cd demo-app
          # Clear any cached builds
          rm -rf .next
          # Debug: Check what the demo app sees
          echo "Checking package structure:"
          ls -la node_modules/next-markdown-blog/
          echo "Checking dist files:"
          ls -la node_modules/next-markdown-blog/dist/
          echo "Checking main entry point:"
          head -10 node_modules/next-markdown-blog/dist/index.js
          npm run build

      - name: Test demo app content
        run: |
          cd demo-app
          # Check if the built app contains expected blog content
          if [ ! -d ".next" ]; then
            echo "Demo app build failed"
            exit 1
          fi

          # Check if blog routes are generated
          if [ ! -d ".next/server/app/blog" ]; then
            echo "Blog routes not generated"
            exit 1
          fi

          echo "Demo app build successful"

  publish:
    runs-on: ubuntu-latest
    needs: [test, integration-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

      - name: Build package
        run: |
          # Clear any incremental build cache
          rm -rf tsconfig.tsbuildinfo
          npm run build

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
