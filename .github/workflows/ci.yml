name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint with Biome
        run: npx @biomejs/biome check .
        continue-on-error: true

      - name: Type check
        run: npm run type-check

      - name: Run unit tests
        run: npm run test:unit

      - name: Build package
        run: npm run build

  integration-test:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Run integration tests
        run: npm run test:integration
        continue-on-error: true

      - name: Setup demo app
        run: |
          cd demo-app
          npm ci

      - name: Build demo app
        run: |
          cd demo-app
          npm run build

      - name: Test demo app content
        run: |
          cd demo-app
          # Check if the built app contains expected blog content
          if [ ! -d ".next" ]; then
            echo "Demo app build failed"
            exit 1
          fi

          # Check if blog routes are generated
          if [ ! -d ".next/server/app/blog" ]; then
            echo "Blog routes not generated"
            exit 1
          fi

          echo "Demo app build successful"

  publish:
    runs-on: ubuntu-latest
    needs: [test, integration-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

      - name: Build package
        run: npm run build

      # TODO: Handle secrets and handle semantic versioning
      # - name: Publish to npm
      #   run: npm publish
      #   env:
      #     NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
