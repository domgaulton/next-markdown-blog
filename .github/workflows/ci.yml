name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint with Biome
        run: npx @biomejs/biome check .

      - name: Type check
        run: npm run type-check

      - name: Run unit tests
        run: npm run test:unit

      - name: Build package
        run: npm run build

  integration-test:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check version update
        run: |
          # Fetch the latest from origin
          git fetch origin

          # Get current version from package.json
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "Current version: $CURRENT_VERSION"

          # Get version from main branch
          MAIN_VERSION=$(git show origin/main:package.json | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin', 'utf8')).version")
          echo "Main branch version: $MAIN_VERSION"

          # Compare versions using npm version compare
          if npm version compare $CURRENT_VERSION $MAIN_VERSION | grep -q "^0$"; then
            echo "❌ Version $CURRENT_VERSION is the same as main branch version $MAIN_VERSION"
            echo "Please update the version in package.json before publishing"
            exit 1
          elif npm version compare $CURRENT_VERSION $MAIN_VERSION | grep -q "^-1$"; then
            echo "❌ Version $CURRENT_VERSION is lower than main branch version $MAIN_VERSION"
            echo "Please update the version in package.json to a higher version before publishing"
            exit 1
          else
            echo "✅ Version $CURRENT_VERSION is higher than main branch version $MAIN_VERSION"
          fi

      - name: Build package
        run: |
          # Clear any incremental build cache
          rm -rf tsconfig.tsbuildinfo
          npm run build

      - name: Verify package build
        run: |
          echo "Verifying package build:"
          ls -la dist/
          echo "Checking main entry point:"
          head -5 dist/index.js
          echo "Checking utils files:"
          ls -la dist/utils/

      - name: Run integration tests
        run: npm run test:integration

      - name: Setup demo app
        run: |
          cd demo-app
          npm ci
          # Ensure the symlinked package is properly resolved
          ls -la node_modules/next-markdown-blog/dist/
          # Reinstall the package to ensure it uses the latest build
          npm install

      - name: Build demo app
        run: |
          cd demo-app
          # Clear any cached builds
          rm -rf .next
          # Debug: Check what the demo app sees
          echo "Checking package structure:"
          ls -la node_modules/next-markdown-blog/
          echo "Checking dist files:"
          ls -la node_modules/next-markdown-blog/dist/
          echo "Checking main entry point:"
          head -10 node_modules/next-markdown-blog/dist/index.js
          npm run build

      - name: Test demo app content
        run: |
          cd demo-app
          # Check if the built app contains expected blog content
          if [ ! -d ".next" ]; then
            echo "Demo app build failed"
            exit 1
          fi

          # Check if blog routes are generated
          if [ ! -d ".next/server/app/blog" ]; then
            echo "Blog routes not generated"
            exit 1
          fi

          echo "Demo app build successful"

  publish:
    runs-on: ubuntu-latest
    needs: [test, integration-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

      - name: Build package
        run: |
          # Clear any incremental build cache
          rm -rf tsconfig.tsbuildinfo
          npm run build

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
