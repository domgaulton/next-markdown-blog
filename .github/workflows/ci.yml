name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  package-version:
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch full history to access main branch

      - name: Check version update
        run: |
          # Fetch the latest from origin
          git fetch origin main

          # Get current version from package.json
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          # Get version from main branch
          MAIN_VERSION=$(git show origin/main:package.json | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin', 'utf8')).version")

          # Normalize versions: strip leading 'v', trim whitespace/newlines/CRs
          NORMALIZED_CURRENT=$(echo "$CURRENT_VERSION" | tr -d '\r\n' | sed -e 's/^v//' -e 's/^\s*//' -e 's/\s*$//')
          NORMALIZED_MAIN=$(echo "$MAIN_VERSION" | tr -d '\r\n' | sed -e 's/^v//' -e 's/^\s*//' -e 's/\s*$//')

          echo "Current version: $NORMALIZED_CURRENT"
          echo "Main branch version: $NORMALIZED_MAIN"

          # Ensure versions are present
          if [ -z "$NORMALIZED_CURRENT" ] || [ -z "$NORMALIZED_MAIN" ]; then
            echo "❌ Could not determine versions (current: '$NORMALIZED_CURRENT', main: '$NORMALIZED_MAIN')"
            echo "Ensure package.json exists on both branches and contains a valid version"
            exit 1
          fi

          # Compare versions using Node.js (no external dependencies)
          COMPARE=$(node -e "
            function compareVersions(v1, v2) {
              const parts1 = v1.split('.').map(Number);
              const parts2 = v2.split('.').map(Number);
              
              for (let i = 0; i < Math.max(parts1.length, parts2.length); i++) {
                const part1 = parts1[i] || 0;
                const part2 = parts2[i] || 0;
                
                if (part1 > part2) return 1;
                if (part1 < part2) return -1;
              }
              return 0;
            }
            
            const result = compareVersions('$NORMALIZED_CURRENT', '$NORMALIZED_MAIN');
            console.log(result);
          ")

          if [ "$COMPARE" = "0" ]; then
            echo "❌ Version $NORMALIZED_CURRENT is the same as main branch version $NORMALIZED_MAIN"
            echo "Please update the version in package.json before publishing"
            exit 1
          elif [ "$COMPARE" = "-1" ]; then
            echo "❌ Version $NORMALIZED_CURRENT is lower than main branch version $NORMALIZED_MAIN"
            echo "Please update the version in package.json to a higher version before publishing"
            exit 1
          else
            echo "✅ Version $NORMALIZED_CURRENT is higher than main branch version $NORMALIZED_MAIN"
          fi

  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint with Biome
        run: npx @biomejs/biome check .

      - name: Type check
        run: npm run type-check

      - name: Run unit tests
        run: npm run test:unit

      - name: Build package
        run: npm run build

  integration-test:
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: |
          # Clear any incremental build cache
          rm -rf tsconfig.tsbuildinfo
          npm run build

      - name: Verify package build
        run: |
          echo "Verifying package build:"
          ls -la dist/
          echo "Checking main entry point:"
          head -5 dist/index.js
          echo "Checking utils files:"
          ls -la dist/utils/

      - name: Run integration tests
        run: npm run test:integration

      - name: Setup demo app
        run: |
          cd demo-app
          npm ci
          # Ensure the symlinked package is properly resolved
          ls -la node_modules/next-markdown-blog/dist/
          # Reinstall the package to ensure it uses the latest build
          npm install

      - name: Build demo app
        run: |
          cd demo-app
          # Clear any cached builds
          rm -rf .next
          # Debug: Check what the demo app sees
          echo "Checking package structure:"
          ls -la node_modules/next-markdown-blog/
          echo "Checking dist files:"
          ls -la node_modules/next-markdown-blog/dist/
          echo "Checking main entry point:"
          head -10 node_modules/next-markdown-blog/dist/index.js
          npm run build

      - name: Test demo app content
        run: |
          cd demo-app
          # Check if the built app contains expected blog content
          if [ ! -d ".next" ]; then
            echo "Demo app build failed"
            exit 1
          fi

          # Check if blog routes are generated
          if [ ! -d ".next/server/app/blog" ]; then
            echo "Blog routes not generated"
            exit 1
          fi

          echo "Demo app build successful"

  publish:
    runs-on: ubuntu-latest
    needs: [test, integration-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

      - name: Build package
        run: |
          # Clear any incremental build cache
          rm -rf tsconfig.tsbuildinfo
          npm run build

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
